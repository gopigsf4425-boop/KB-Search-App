<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KB Search — Insert KB Link to Ticket</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --accent-1: #4b6ef6;
      --accent-2: #7b61ff;
      --muted: #6b7280;
      --card-bg: #ffffff;
      --surface: #f5f6fb;
    }
    html,body{height:100%;}
    body{font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;padding:8px;background:var(--surface);display:flex;flex-direction:column;align-items:stretch;min-height:100vh}
    /* Make card stretch to available height so it fills the iframe and removes empty area below */
    .card{max-width:920px;width:100%;box-sizing:border-box;margin:0 auto;background:#fff;padding:16px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,0.06);display:flex;flex-direction:column;min-height:0;flex:1}
    /* Layout row: allow wrapping on narrow viewports */
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    input[type=text]{flex:1 1 auto;min-width:120px;padding:10px 12px;border:1px solid #e6e9f2;border-radius:10px;box-sizing:border-box;outline:none;background:linear-gradient(180deg,#fff,#fbfdff);box-shadow:0 6px 18px rgba(79,84,255,0.06);transition:box-shadow .18s,transform .12s}
    input[type=text]:focus{box-shadow:0 10px 30px rgba(79,84,255,0.12);transform:translateY(-1px)}
    button{flex:0 0 auto;padding:10px 14px;background:linear-gradient(90deg,var(--accent-1),var(--accent-2));color:#fff;border:none;border-radius:10px;cursor:pointer;font-weight:600;box-shadow:0 8px 20px rgba(75,110,246,0.18);transition:transform .15s,box-shadow .15s}
    button:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(75,110,246,0.22)}
    .results{margin-top:12px;flex:1;overflow:auto;padding-right:6px}
    .item{padding:14px;border:1px solid rgba(15,23,32,0.04);border-radius:12px;margin-bottom:12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:linear-gradient(180deg,#fff,#fbfdff);box-shadow:0 6px 18px rgba(16,24,40,0.03);transition:transform .12s,box-shadow .12s}
    .item:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(16,24,40,0.06)}
    .meta{color:var(--muted);font-size:12px}
    .title{font-weight:700;color:#0f1724;margin-bottom:6px}
    .pub-badge{display:inline-block;padding:6px 8px;background:#eef2ff;color:var(--accent-1);border-radius:999px;font-weight:600;font-size:12px;margin-left:8px}
    .right-col{display:flex;align-items:flex-start;gap:8px}
    /* Primary search button (keeps strong gradient) */
    .search-btn{padding:10px 16px;font-weight:700;border-radius:10px}

    /* Insert Link buttons are secondary/outlined */
    .insert-btn{padding:10px 14px;border-radius:10px;background:#fff;color:var(--accent-1);border:1px solid rgba(75,110,246,0.18);font-weight:700;box-shadow:none}
    .insert-btn:hover{background:linear-gradient(180deg,rgba(75,110,246,0.06),rgba(75,110,246,0.02));box-shadow:0 10px 24px rgba(75,110,246,0.06)}
    /* Small screens: stack input and button, stack result item contents */
    @media (max-width:420px){
      .card{padding:10px}
      .row{flex-direction:column;align-items:stretch}
      button{width:100%;margin-top:8px}
      .item{flex-direction:column;align-items:stretch}
      .item > div { width:100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>BoldDesk KB Search</h2>

    <div class="row">
      <input id="kb-query" type="text" placeholder="Search by Title or ID">
      <button id="search-btn" class="search-btn">Search</button>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script src="https://unpkg.com/bolddesk-final-framework-sdk@1.0.37/build/baf_sdk.min.js"></script>
  <script>
    let client = null;

    function initClient(){
      if(typeof BAFClient === 'undefined'){
        return;
      }
      try{
        client = BAFClient.init();
      }catch(e){
      }
    }

    function renderResults(items){
      const container = document.getElementById('results');
      container.innerHTML = '';
      if(!items || !items.length){
        container.innerHTML = '<div class="meta">No results</div>';
        return;
      }
      items.forEach(it => {
        const div = document.createElement('div');
        div.className = 'item';
        const left = document.createElement('div');
        left.innerHTML = '<div><strong>' + (it.title || 'Untitled') + '</strong></div>' +
                         '<div class="meta">Published: ' + (it.publishedOn || '-') + '</div>';
        const right = document.createElement('div');
        const btn = document.createElement('button');
        btn.className = 'insert-btn';
        btn.textContent = 'Insert Link';
        // compute a reliable URL: prefer `customerPortalUrl`, otherwise build one from id/slug
        const computedUrl = it.customerPortalUrl || (it.id ? (location.origin.replace(/\/$/, '') + '/en-US/kb/article/' + it.id + '/' + (it.slugTitle || '')) : null);
       
        console.log(it.customerPortalUrl);
        console.log(computedUrl);

        btn.onclick = () => insertToComment(computedUrl);
        right.appendChild(btn);
        div.appendChild(left);
        div.appendChild(right);
        container.appendChild(div);
      });
    }

    function doInvoke(method, payload){
      if(!client){ return; }
      client.invoke(method, payload || {}).then(res => {
      }).catch(err => {
      });
    }

    function insertToComment(url){
      if(!url){ }
      // Insert the customerPortalUrl into the ticket comment (append text)
      const txt = url + '\n';
      doInvoke('comment.appendText', { text: txt });
    }

    function performSearch(){
      const q = document.getElementById('kb-query').value.trim();
      if(!q){ return; }
      // Build request using brandId from context if available
      function buildAndRequest(brandId){
        const brandQuery = brandId ? 'q=brands:[' + brandId + ']&' : '';
        const url = '/kb-api/v1.0/articles/en-US?view=published&' + brandQuery + 'Page=1&PerPage=15&filter=' + q;

        client.request({ url: url, type: 'GET', isInternal: true }).then(response => {
          const items = response && response.result ? response.result : [];
          renderResults(items);
        }).catch(err => {
          console.error('KB request failed', err);
        });
      }

      if (client && typeof client.context === 'function') {
        // try to read single brand id from context
        client.context('brandId').then(data => {
          // `data` may be the id directly or an object containing the id
          let bid = null;
          if (data === null || data === undefined) bid = null;
          else if (typeof data === 'object' && data.brandId !== undefined) bid = data.brandId;
          else bid = data;
          buildAndRequest(bid);
        }).catch(err => {
          console.warn('Failed to read brandId from context, proceeding without it', err);
          buildAndRequest(null);
        });
      } else {
        buildAndRequest(null);
      }
    }

    // Wire UI
    document.getElementById('search-btn').addEventListener('click', performSearch);
    document.getElementById('kb-query').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ performSearch(); } });

    window.addEventListener('load', function(){ initClient(); });
  </script>
</body>
</html>
