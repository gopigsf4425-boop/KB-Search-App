<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KB Search — Insert KB Link to Ticket</title>
  <style>
    body{font-family:Segoe UI,Roboto,Arial,sans-serif;padding:18px;background:#f5f6fb}
    .card{max-width:900px;margin:0 auto;background:#fff;padding:16px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
    .row{display:flex;gap:8px}
    input[type=text]{flex:1;padding:8px;border:1px solid #dcdfe6;border-radius:6px}
    button{padding:8px 12px;background:#4b6ef6;color:#fff;border:none;border-radius:6px;cursor:pointer}
    .results{margin-top:12px}
    .item{padding:10px;border:1px solid #eef0fb;border-radius:6px;margin-bottom:8px;display:flex;justify-content:space-between;gap:12px}
    .meta{color:#666;font-size:12px}
  </style>
</head>
<body>
  <div class="card">
    <h2>Sdk KB Search</h2>

    <div class="row">
      <input id="kb-query" type="text" placeholder="Enter search text (e.g. Comprehensive)" value="Comprehen">
      <button id="search-btn">Search</button>
    </div>

    <div class="results" id="results"></div>
  </div>

  <script src="https://unpkg.com/bolddesk-final-framework-sdk@1.0.37/build/baf_sdk.min.js"></script>
  <script>
    let client = null;

    function initClient(){
      if(typeof BAFClient === 'undefined'){
        return;
      }
      try{
        client = BAFClient.init();
      }catch(e){
      }
    }

    function renderResults(items){
      const container = document.getElementById('results');
      container.innerHTML = '';
      if(!items || !items.length){
        container.innerHTML = '<div class="meta">No results</div>';
        return;
      }
      items.forEach(it => {
        const div = document.createElement('div');
        div.className = 'item';
        const left = document.createElement('div');
        left.innerHTML = '<div><strong>' + (it.title || 'Untitled') + '</strong></div>' +
                         '<div class="meta">Published: ' + (it.publishedOn || '-') + '</div>';
        const right = document.createElement('div');
        const btn = document.createElement('button');
        btn.textContent = 'Insert Link';
        // compute a reliable URL: prefer `customerPortalUrl`, otherwise build one from id/slug
        const computedUrl = it.customerPortalUrl || (it.id ? (location.origin.replace(/\/$/, '') + '/en-US/kb/article/' + it.id + '/' + (it.slugTitle || '')) : null);
       
        console.log(it.customerPortalUrl);
        console.log(computedUrl);

        btn.onclick = () => insertToComment(computedUrl);
        right.appendChild(btn);
        div.appendChild(left);
        div.appendChild(right);
        container.appendChild(div);
      });
    }

    function doInvoke(method, payload){
      if(!client){ return; }
      client.invoke(method, payload || {}).then(res => {
      }).catch(err => {
      });
    }

    function insertToComment(url){
      if(!url){ }
      // Insert the customerPortalUrl into the ticket comment (append text)
      const txt = url + '\n';
      doInvoke('comment.appendText', { text: txt });
    }

    function performSearch(){
      const q = document.getElementById('kb-query').value.trim();
      if(!q){ return; }
      const url = '/kb-api/v1.0/articles/en-US?view=published&Page=1&PerPage=5&filter='+q;

      client.request({ url: url, type: 'GET', isInternal: true }).then(response => {
        const items = response && response.result ? response.result : [];
        renderResults(items);
      }).catch(err => {
      });
    }

    // Wire UI
    document.getElementById('search-btn').addEventListener('click', performSearch);
    document.getElementById('kb-query').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ performSearch(); } });

    window.addEventListener('load', function(){ initClient(); });
  </script>
</body>
</html>
